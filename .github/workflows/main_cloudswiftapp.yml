# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cloudswiftapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time. Do not cancel a run that is already uploading to Azure —
# OneDeploy then dies with "The operation was canceled."
concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}

      - name: Prepare standalone output for Azure Linux
        run: |
          # Copy public & static assets (Next.js standalone doesn't include these)
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

          # Remove oryx-manifest.toml — prevents Oryx from extracting non-existent node_modules.tar.gz
          rm -f .next/standalone/oryx-manifest.toml

          # CRITICAL FIX: Oryx reads package.json "start" script and generates its own
          # /opt/startup/startup.sh that runs "npm start". The root package.json has
          # "start": "next start" but the `next` binary doesn't exist in standalone.
          # Override package.json so Oryx generates: npm start → node server.js ✓
          cat > .next/standalone/package.json << 'EOF'
          {
            "name": "cloudswiftapp",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF

      - name: Zip standalone output
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cloudswiftapp'
          slot-name: 'Production'
          package: deploy.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}